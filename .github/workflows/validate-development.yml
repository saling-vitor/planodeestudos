name: Validar desenvolvimento

on:
  push:
    branches:
      - 'develop/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sincronizar versão PWA
        run: python3 scripts/sync_pwa_version.py

      - name: Gerar dados derivados
        run: |
          python3 scripts/build_static_data.py
          python3 scripts/build_materials_manifest.py
          python3 scripts/build_topic_catalogs.py
          python3 scripts/build_simulations_manifest.py
          python3 scripts/build_files_manifest.py
          python3 scripts/build_offline_pack.py

      - name: Validar estrutura
        run: python3 scripts/validate_production.py

      - name: Validar contrato gráfico
        run: python3 scripts/validate_layout_contract.py

      - name: Validar CSS
        run: python3 scripts/validate_css.py

      - name: Auditar manutenção do CSS dos mapas
        run: python3 scripts/audit_study_map_css.py

      - name: Validar JavaScript
        run: python3 scripts/validate_javascript.py

      - name: Auditar modularização do Portal
        run: python3 scripts/audit_portal_inline.py

      - name: Validar PWA e cache
        run: python3 scripts/validate_pwa_cache.py

      - name: Validar contrato de versões
        run: python3 scripts/validate_versions.py

      - name: Preparar navegador
        run: python3 -m pip install --disable-pip-version-check selenium

      - name: Regressão de desenvolvimento
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/plano-arq-development-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 scripts/runtime_data_safety.py http://127.0.0.1:8765/
          python3 scripts/runtime_automation_v11.py http://127.0.0.1:8765/
          STUDY_MAP_AUDIT_DIR=${{ runner.temp }}/study-map-audit python3 scripts/runtime_study_map_audit.py http://127.0.0.1:8765/
          python3 scripts/runtime_offline_reliability.py http://127.0.0.1:8765/
          LAYOUT_AUDIT_DIR=${{ runner.temp }}/layout-audit LAYOUT_AUDIT_STRICT=1 python3 scripts/runtime_layout_audit.py http://127.0.0.1:8765/

      - name: Salvar evidências de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/study-map-audit
            ${{ runner.temp }}/layout-audit
          if-no-files-found: warn
          retention-days: 7
