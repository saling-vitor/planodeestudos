name: Gate V1.2 Release

on:
  push:
    branches:
      - 'release/v1.2.0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-v12-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sincronizar versão PWA
        run: python3 scripts/sync_pwa_version.py

      - name: Gerar dados derivados
        run: |
          python3 scripts/build_static_data.py
          python3 scripts/build_materials_manifest.py
          python3 scripts/build_topic_catalogs.py
          python3 scripts/build_simulations_manifest.py
          python3 scripts/build_files_manifest.py
          python3 scripts/build_offline_pack.py

      - name: Validar contratos finais
        run: |
          python3 scripts/validate_production.py --strict
          python3 scripts/validate_layout_contract.py
          python3 scripts/validate_css.py
          python3 scripts/audit_study_map_css.py
          python3 scripts/validate_javascript.py
          python3 scripts/audit_portal_inline.py
          python3 scripts/validate_pwa_cache.py
          python3 scripts/validate_versions.py
          python3 scripts/validate_release_freeze_v12.py --git
          python3 scripts/validate_release_qa_v12.py --release
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          contract=json.loads((root/'data/version-contract.json').read_text('utf-8'))
          cloud=json.loads((root/'data/cloud-config.json').read_text('utf-8'))
          runtime=(root/'assets/js/pa-data-v03.js').read_text('utf-8')
          m=re.search(r"const RELEASE=['\"]([^'\"]+)['\"]",runtime)
          assert contract.get('targetRelease')=='1.2.0'
          assert contract.get('productBaseline')=='1.2.0'
          assert contract.get('releaseStatus')=='final-preparation'
          assert cloud.get('version')=='1.2.0'
          assert m and m.group(1)=='1.2.0'
          assert 'const BUILD_MAINTENANCE=false;' in runtime
          assert 'const MAINTENANCE_MODE=false;' in (root/'service-worker.js').read_text('utf-8')
          print('V1.2.0 final preparation: OK')
          PY

      - name: Preparar navegador
        run: python3 -m pip install --disable-pip-version-check selenium

      - name: Regressão completa da release
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/plano-arq-v12-release-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 scripts/runtime_data_safety.py http://127.0.0.1:8765/
          python3 scripts/runtime_automation_v11.py http://127.0.0.1:8765/
          python3 scripts/runtime_replan_v01.py http://127.0.0.1:8765/
          python3 scripts/runtime_post_sim_v01.py http://127.0.0.1:8765/
          python3 scripts/runtime_health_v01.py http://127.0.0.1:8765/
          STUDY_MAP_AUDIT_DIR=${{ runner.temp }}/study-map-audit python3 scripts/runtime_study_map_audit.py http://127.0.0.1:8765/
          python3 scripts/runtime_offline_reliability.py http://127.0.0.1:8765/
          LAYOUT_AUDIT_DIR=${{ runner.temp }}/layout-audit LAYOUT_AUDIT_STRICT=1 python3 scripts/runtime_layout_audit.py http://127.0.0.1:8765/
          python3 scripts/runtime_stage_i.py http://127.0.0.1:8765/

      - name: Salvar evidências da release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/study-map-audit
            ${{ runner.temp }}/layout-audit
          if-no-files-found: warn
          retention-days: 30
