name: Publicar Plano ARQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Auditoria estrutural da fonte
        run: python3 scripts/validate_production.py

      - name: Detectar pacote de produção
        id: package
        shell: bash
        run: |
          missing=()
          for path in materials simulados assets data edital manifest.webmanifest scripts/build_static_data.py scripts/build_materials_manifest.py scripts/build_topic_catalogs.py; do
            [[ -e "$path" ]] || missing+=("$path")
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "$(IFS=', '; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            echo "::notice::Pacote de produção incompleto. Publicação anterior preservada."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Resumo do pacote incompleto
        if: steps.package.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## GitHub Pages preservado"
            echo
            echo "O branch `main` ainda não contém todo o pacote necessário para uma publicação segura."
            echo
            echo "**Ausentes:** `${{ steps.package.outputs.missing }}`"
            echo
            echo "Nenhum deploy foi executado; a última versão publicada continua intacta."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gerar dados de produção
        if: steps.package.outputs.ready == 'true'
        run: |
          python3 scripts/build_static_data.py
          python3 scripts/build_materials_manifest.py
          python3 scripts/build_topic_catalogs.py
          python3 scripts/build_simulations_manifest.py
          python3 scripts/build_files_manifest.py
          python3 scripts/build_offline_pack.py

      - name: Validar contrato gráfico
        if: steps.package.outputs.ready == 'true'
        run: python3 scripts/validate_layout_contract.py

      - name: Validar CSS
        if: steps.package.outputs.ready == 'true'
        run: python3 scripts/validate_css.py

      - name: Validar JavaScript
        if: steps.package.outputs.ready == 'true'
        run: python3 scripts/validate_javascript.py

      - name: Validar PWA e cache
        if: steps.package.outputs.ready == 'true'
        run: python3 scripts/validate_pwa_cache.py

      - name: Validar pacote de produção
        if: steps.package.outputs.ready == 'true'
        run: python3 scripts/validate_production.py --strict

      - name: Versionar cache do PWA
        if: steps.package.outputs.ready == 'true'
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:8}"
          python3 - "$short_sha" <<'PY'
          import re, sys
          from pathlib import Path
          p=Path("service-worker.js")
          text=p.read_text("utf-8")
          version=f"19.3-{sys.argv[1]}"
          updated,n=re.subn(r"const VERSION='[^']+';",f"const VERSION='{version}';",text,count=1)
          if n!=1:
              raise SystemExit("Não foi possível versionar o service worker")
          p.write_text(updated,"utf-8")
          print(f"Service Worker: {version}")
          PY

      - name: Preparar site público
        if: steps.package.outputs.ready == 'true'
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='cloud/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            --exclude='data/*.json' \
            --exclude='data/offline-pack.js' \
            ./ _site/
          mkdir -p _site/data
          cp data/offline-pack.json _site/data/offline-pack.json

      - name: Configurar GitHub Pages
        if: steps.package.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Preparar navegador para auditoria do PWA
        if: steps.package.outputs.ready == 'true'
        run: python3 -m pip install --disable-pip-version-check selenium

      - name: Registrar PWA publicado antes do deploy
        if: steps.package.outputs.ready == 'true'
        env:
          PWA_URL: https://saling-vitor.github.io/planodeestudos/
          PWA_PHASE: before
          PWA_PROFILE_DIR: ${{ runner.temp }}/plano-arq-pwa-profile
          PWA_STATE_FILE: ${{ runner.temp }}/plano-arq-pwa-before.json
        run: python3 scripts/runtime_pwa_smoke.py "$PWA_URL"

      - name: Publicar
        if: steps.package.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Auditoria visual do layout publicado
        if: steps.package.outputs.ready == 'true'
        env:
          PWA_URL: ${{ steps.deployment.outputs.page_url }}
          LAYOUT_AUDIT_STRICT: "0"
          LAYOUT_AUDIT_DIR: ${{ runner.temp }}/layout-audit
        run: python3 scripts/runtime_layout_audit.py "$PWA_URL"

      - name: Salvar evidências da auditoria visual
        if: always() && steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: layout-audit-${{ github.sha }}
          path: ${{ runner.temp }}/layout-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Testar PWA no deploy real
        if: steps.package.outputs.ready == 'true'
        env:
          PWA_URL: ${{ steps.deployment.outputs.page_url }}
          PWA_PHASE: after
          PWA_PROFILE_DIR: ${{ runner.temp }}/plano-arq-pwa-profile
          PWA_STATE_FILE: ${{ runner.temp }}/plano-arq-pwa-before.json
        run: python3 scripts/runtime_pwa_smoke.py "$PWA_URL"
