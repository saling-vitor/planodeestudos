name: Publicar Plano ARQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Auditoria estrutural
        run: python3 scripts/validate_production.py

      - name: Detectar pacote de produção
        id: package
        shell: bash
        run: |
          missing=()
          for path in scripts/build_materials_manifest.py materials simulados assets data edital manifest.webmanifest; do
            [[ -e "$path" ]] || missing+=("$path")
          done
          if (( ${#missing[@]} )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "$(IFS=', '; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            echo "::notice::Pacote de produção incompleto. Publicação anterior preservada."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Resumo do pacote incompleto
        if: steps.package.outputs.ready != 'true'
        shell: bash
        run: |
          {
            echo "## GitHub Pages preservado"
            echo
            echo "O branch `main` ainda não contém todo o pacote necessário para uma publicação segura."
            echo
            echo "**Ausentes:** `${{ steps.package.outputs.missing }}`"
            echo
            echo "Nenhum deploy foi executado; a última versão publicada continua intacta."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gerar manifestos
        if: steps.package.outputs.ready == 'true'
        run: |
          python3 scripts/build_materials_manifest.py
          python3 scripts/build_topic_catalogs.py
          python3 scripts/build_simulations_manifest.py
          python3 scripts/build_files_manifest.py
          python3 scripts/build_offline_pack.py

      - name: Validar pacote de produção
        if: steps.package.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html biblioteca.html planejamento.html edital.html revisoes.html
            questoes.html desempenho.html arquivos.html simulados.html erros.html
            diagnostico.html historico.html configuracoes.html creditos.html offline.html
            404.html manifest.webmanifest service-worker.js .nojekyll
            assets/css/pa-tokens-v01.css assets/css/pa-components-v01.css assets/css/pa-shell-v16.css
            assets/js/pa-pwa-v01.js assets/js/pa-shell-v16.js assets/js/pa-data-v03.js
            assets/js/pa-sync-v03.js assets/js/pa-drive-v01.js assets/js/pa-actions-v01.js
            data/navigation.js data/contests.js data/materials.js data/exam-schemas.js
            data/question-catalog.js data/review-catalog.js data/simulations.js
            data/cloud-config.js data/offline-pack.json
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "ERRO: arquivo obrigatório ausente: $f"; exit 1; }
          done
          maps=$(find materials -maxdepth 1 -type f -name '*.html' | wc -l | tr -d ' ')
          sims=$(find simulados -maxdepth 1 -type f -name '*.html' | wc -l | tr -d ' ')
          test "$maps" -eq 14 || { echo "ERRO: esperados 14 mapas; encontrados $maps"; exit 1; }
          test "$sims" -eq 3 || { echo "ERRO: esperados 3 simulados; encontrados $sims"; exit 1; }
          echo "Preflight OK: $maps mapas e $sims simulados."
          python3 scripts/validate_production.py --strict

      - name: Versionar cache do PWA
        if: steps.package.outputs.ready == 'true'
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:8}"
          python3 - "$short_sha" <<'PY'
          import re, sys
          from pathlib import Path
          p=Path("service-worker.js")
          text=p.read_text("utf-8")
          version=f"19.0-{sys.argv[1]}"
          updated,n=re.subn(r"const VERSION='[^']+';",f"const VERSION='{version}';",text,count=1)
          if n!=1:
              raise SystemExit("Não foi possível versionar o service worker")
          p.write_text(updated,"utf-8")
          print(f"Service Worker: {version}")
          PY

      - name: Preparar site público
        if: steps.package.outputs.ready == 'true'
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='cloud/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='*.zip' \
            ./ _site/

      - name: Configurar GitHub Pages
        if: steps.package.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        if: steps.package.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
